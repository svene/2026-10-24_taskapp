# app-server configuration

quarkus.application.name=taskapp

# --- SQLite (outbound-sqlite) ---
# One file. TASKAPP_DB_PATH overrides it; its parent directory is created on startup and an existing file is
# backed up into backups/ next to it, keeping the newest 7 (DatabaseStartup).
# The tests point it at a fresh temp file (TempDatabaseConfigSource).
taskapp.db.path=${user.home}/.local/share/taskapp/taskapp.db
%dev.taskapp.db.path=${user.dir}/.data/taskapp/dev.db

quarkus.datasource.db-kind=sqlite
# sqlite-jdbc runs these PRAGMAs on every connection it opens.
quarkus.datasource.jdbc.url=jdbc:sqlite:${taskapp.db.path}?foreign_keys=on&journal_mode=wal&busy_timeout=5000
# SQLite has one writer at a time: one connection, so a transaction never waits on another one's lock.
quarkus.datasource.jdbc.max-size=1

# DatabaseStartup migrates, after creating the database directory.
quarkus.flyway.migrate-at-start=false

# --- Running the built app (spec §6) ---
# install.sh copies the uber-jar to ~/.local/share/taskapp/taskapp.jar.
quarkus.package.jar.type=uber-jar
# Local only; QUARKUS_HTTP_PORT overrides the port. Dev and test keep Quarkus' 8080 / 8081.
%prod.quarkus.http.host=127.0.0.1
%prod.quarkus.http.port=7070
