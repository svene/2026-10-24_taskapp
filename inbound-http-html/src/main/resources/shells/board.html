<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Taskapp</title>
    <link rel="stylesheet" href="/css/bulma.min.css">
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/board.css">
    <!-- synchronous, before the first paint: applies the saved dark/light choice without a flash -->
    <script src="/js/theme.js"></script>
    <meta name="htmx-config" content='{"noSwap": [204, 304, "5xx"]}'>
    <script src="/js/htmx.org/4.0.0/htmx.js"></script>
    <!-- must load right after htmx.js: registers the `hono` extension that renders the { route, vm } responses -->
    <script src="/js/hono/hx-hono.js"></script>
</head>
<body>
<div class="topbar">
    <h1 class="title is-5">Taskapp</h1>
    <button type="button" class="button is-small theme-toggle" title="Toggle dark/light theme" aria-label="Toggle dark/light theme"></button>
</div>
<div id="app" hx-get="/board" hx-trigger="load" hx-swap="innerHTML"></div>
</body>
</html>
